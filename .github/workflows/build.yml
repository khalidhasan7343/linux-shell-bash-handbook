name: Build PDF

# Builds the handbook on every push / pull request.
# Pushing a version tag (e.g. v1.0.0) also publishes the PDF as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.15.1"
  PDF: build/linux-shell-bash-handbook.pdf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      - name: Compile the handbook
        run: |
          mkdir -p build
          typst compile --font-path fonts --ignore-system-fonts src/main.typ "$PDF"

      - name: Upload PDF as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-shell-bash-handbook
          path: ${{ env.PDF }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PDF }}
          generate_release_notes: true
